<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
<meta name="color-scheme" content="light dark">
<title>Material Asus Router</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header class="bar" id="bar">

  <img src="assets/icon.png" alt="" class="logo" width="18" height="18">
  <span class="title">Material Asus Router</span>

  <button class="icon win" id="max" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="maxpath" d="M6 6h12v12H6zm1.6 1.6v8.8h8.8V7.6z"/></svg></button>
