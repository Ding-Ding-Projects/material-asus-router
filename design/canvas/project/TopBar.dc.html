<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header class="mx topbar {{motionCls}}" style="--accent:{{accent}};--dark:{{darkNum}};background:transparent">
<div class="tb1"><h1>{{title}}</h1>
<button class="srch" aria-label="{{search}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M20 20l-3.5-3.5"/></svg><span>{{search}}</span><kbd>Ctrl K</kbd></button>
<span class="tag pri"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10H7z M9 3v4 M15 3v4 M9 17v4 M15 17v4 M3 9h4 M3 15h4 M17 9h4 M17 15h4"/></svg>{{fw}}</span>
<a class="icb" href="Language.dc.html" aria-label="{{langLabel}}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h9 M8.5 3v2 M5 5c.5 4 3.5 7 7 8 M12 5c-.5 4-3.5 7-7 8 M13 21l4-10 4 10 M14.5 17.5h5"/></svg></a>
<a class="icb" href="Notifications.dc.html" aria-label="{{bell}}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z M10 21h4"/></svg><span class="dotb">4</span></a>
<span class="who"><b>P</b>{{who}}</span></div>
<div class="tabs eq" role="tablist" aria-label="{{title}}" style="--cnt:{{cnt}};--idx:{{idx}};max-width:{{maxw}}"><sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3"><button role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}">{{tb.label}}</button></sc-for><i class="tind"></i></div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"string","default":"Overview","section":"Content"},"tabs":{"editor":"string","default":"Overview,Traffic,Health","section":"Content"},"active":{"editor":"number","default":0,"section":"Content"},"accent":{"editor":"color","default":"#4f5bd5","options":["#4f5bd5","#00897b","#d81b60","#f4511e","#7c4dff"],"section":"Look"},"dark":{"editor":"boolean","default":false,"section":"Look"},"motion":{"editor":"enum","options":["calm","standard","expressive"],"default":"expressive","section":"Look"},"firmware":{"editor":"enum","options":["merlin","stock"],"default":"merlin","section":"Router"},"role":{"editor":"enum","options":["owner","operator","viewer"],"default":"owner","section":"Router"},"lang":{"editor":"enum","options":["en","yue","both"],"default":"en","section":"Language"},"$preview":{"width":1168,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const lang = p.lang ?? 'en', role = p.role ?? 'owner', firmware = p.firmware ?? 'merlin', motion = p.motion ?? 'expressive';
    const accent = p.accent || '#4f5bd5';
    const dark = p.dark === true || p.dark === 'true' || p.dark === 1 || p.dark === '1';
    const T = (en, yue) => (en === yue || lang === 'en') ? en : lang === 'yue' ? yue : en + ' · ' + yue;
    const base = { accent, darkNum: dark ? 1 : 0, motionCls: motion === 'calm' ? 'calm' : motion === 'standard' ? 'std' : '' };
    const s = this.state || {};
    const list = String(p.tabs || 'Overview').split(',');
    const idx = s.i ?? (Number(p.active) || 0);
    const tabs = list.map((label, i) => ({ label, sel: i === idx ? 'true' : 'false', pick: () => this.setState({ i }) }));
    return Object.assign(base, { title: p.title || 'Overview', tabs, cnt: list.length, idx, maxw: (list.length * 190) + 'px',
      search: T('Search everything', '搜尋所有嘢'), langLabel: T('Language', '語言'), bell: T('Notifications, 4 unread', '通知，4 則未讀'),
      fw: firmware === 'merlin' ? 'Asuswrt-Merlin' : T('Stock ASUS', '原廠 ASUS'),
      who: role === 'owner' ? T('Pat · Owner', 'Pat · 擁有人') : role === 'operator' ? T('Pat · Operator', 'Pat · 操作員') : T('Pat · Viewer', 'Pat · 檢視者') });
  }
}
</script>
</body>
</html>
