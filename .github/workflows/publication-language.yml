# Checks every pushed commit for wording that must not be published. The scanner code comes
# from a pinned trusted commit (PUBLICATION_SCAN_POLICY_SHA); the word list and the reviewed
# exceptions come from protected repository secrets and are never printed. This check runs
# after the push; local hooks check before it.
name: Publication language scan
on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      scope:
        description: Manual execution checks the current tree only, without history proof.
        type: choice
        required: true
        default: current-tree-only
        options: [current-tree-only]
permissions:
  contents: read
jobs:
  publication-language:
    name: ${{ github.event_name == 'workflow_dispatch' && 'publication-language-current-tree' || 'publication-language' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
      MANUAL_SCOPE: ${{ inputs.scope }}
    steps:
      - name: Validate trusted policy pin and target
        env:
          POLICY_SHA: ${{ vars.PUBLICATION_SCAN_POLICY_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$POLICY_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Trusted policy pin is unavailable.'; exit 2; }
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Candidate identity is unavailable.'; exit 2; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MANUAL_SCOPE" == current-tree-only ]] || { echo 'Explicit manual scope is unavailable.'; exit 2; }
          elif [[ "$EVENT_NAME" == push || "$EVENT_NAME" == pull_request_target ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Event base is unavailable.'; exit 2; }
            [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]] || { echo 'Event base publication is unknown.'; exit 2; }
          else
            echo 'Unsupported event.'; exit 2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read pinned trusted scanner
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.PUBLICATION_SCAN_POLICY_SHA }}
          path: trusted-policy
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read candidate as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 0
      - name: Scan with pinned code and protected runtime policy
        env:
          PUBLICATION_DICTIONARY: ${{ secrets.PUBLICATION_LANGUAGE_DATA }}
          PUBLICATION_EXCEPTIONS: ${{ secrets.PUBLICATION_LANGUAGE_EXCEPTIONS }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          scratch=$(mktemp -d "$RUNNER_TEMP/publication-policy.XXXXXX")
          trap 'rm -f "$scratch/exceptions.json"; rmdir "$scratch"' EXIT
          node -e 'const fs=require("node:fs"); if(!process.env.PUBLICATION_EXCEPTIONS || !process.env.PUBLICATION_DICTIONARY) process.exit(2); fs.writeFileSync(process.argv[1], process.env.PUBLICATION_EXCEPTIONS, {mode:0o600});' "$scratch/exceptions.json"
          args=(--root "$GITHUB_WORKSPACE/candidate" --tip "$CANDIDATE_SHA" --exceptions-file "$scratch/exceptions.json")
          if [[ "$EVENT_NAME" == workflow_dispatch && "$MANUAL_SCOPE" == current-tree-only ]]; then
            args+=(--mode current-tree-only)
          else
            args+=(--mode history --base "$BASE_SHA")
          fi
          node -e 'process.stdout.write(process.env.PUBLICATION_DICTIONARY || "")' |
            env -u PUBLICATION_DICTIONARY -u PUBLICATION_EXCEPTIONS -u NODE_OPTIONS -u NODE_PATH -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
              node "$GITHUB_WORKSPACE/trusted-policy/scripts/run-publication-language-ci.mjs" "${args[@]}" |
            env -u PUBLICATION_DICTIONARY -u PUBLICATION_EXCEPTIONS node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{const r=JSON.parse(s),categories={}; for(const f of r.findings??[]) categories[f.category]=(categories[f.category]??0)+1; console.log(JSON.stringify({status:r.status,scope:r.scope,historyProof:r.historyProof===true,scannedRevisions:r.scannedRevisions,findings:(r.findings??[]).length,categories})); if(r.status!=="passed") process.exit(1);});'
