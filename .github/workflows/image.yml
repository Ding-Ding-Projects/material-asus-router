name: Image

on:
  push:
    branches: [main]
    paths: ['server/**', 'public/**', 'package.json', 'package-lock.json', 'Dockerfile', '.dockerignore', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish for x86-64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/ding-ding-projects/material-asus-router:${{ steps.meta.outputs.version }}
            ghcr.io/ding-ding-projects/material-asus-router:sha-${{ steps.meta.outputs.sha }}
            ghcr.io/ding-ding-projects/material-asus-router:latest
